{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <div>
    <p class="text-xs uppercase text-muted mb-0">Contrato #{{ contrato.cdContrato }}</p>
    <h3 class="mb-0">{{ contrato.cdAluno.dsNome }}</h3>
  </div>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-secondary" onclick="window.print()">Imprimir / PDF</button>
    <a class="btn btn-outline-secondary" href="{{ request.GET.next|default:'/' }}">Voltar</a>
  </div>
</div>

<div class="card">
  <div class="card-body">
    <div class="contrato-documento" style="max-width: 800px; margin: 0 auto; line-height: 1.6;">
      {{ conteudo|safe }}
    </div>
  </div>
</div>

<style>
  @media print {
    .navbar, .btn, nav, header, .breadcrumb { display: none !important; }
    .card { border: 0 !important; box-shadow: none !important; }
  }
</style>
{% endblock %}
