{% extends "base.html" %}
{% block content %}
<div class="signature-page">
  <div class="signature-shell">
    <div class="signature-empty">
      <div class="signature-empty__icon">✓</div>
      <h3 class="mb-2">
        {% if ja_assinado %}Termo já assinado{% else %}Termo assinado com sucesso!{% endif %}
      </h3>
      <p class="text-muted mb-0">
        {{ aluno.dsNome }}, sua autorização de uso de imagem foi registrada. Obrigada! 🌿
      </p>
    </div>
  </div>
</div>
{% endblock %}
