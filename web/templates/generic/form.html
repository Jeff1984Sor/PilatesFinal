{% extends "base.html" %}
{% block content %}
<div class="mayris-page">
  <div class="mayris-page__header">
    <div>
      <div class="mayris-kicker">Cadastro</div>
      <h2 class="mayris-title">{{ title }}</h2>
    </div>
  </div>

  <div class="mayris-card">
    <form method="post" enctype="multipart/form-data" class="mayris-form">
      {% csrf_token %}
      {% if next_url %}
        <input type="hidden" name="next" value="{{ next_url }}" />
      {% endif %}
      {{ form.as_p }}
      <div class="mayris-form__actions">
        <button class="btn btn-primary mayris-btn-primary" type="submit">Salvar</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
