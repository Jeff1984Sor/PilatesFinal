<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mayris Pilates - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="/static/css/app.css" rel="stylesheet" />
</head>
<body class="mayris-login">
  <div class="mayris-login__split">
    <div class="mayris-login__left">
      <div class="mayris-login__brand">Mayris Pilates</div>
      <p class="mayris-login__tag">Movimento, forca e leveza para uma vida ativa.</p>
      <div class="mayris-login__glow"></div>
    </div>
    <div class="mayris-login__right">
      <div class="mayris-login__card">
        <div class="mayris-login__title">Bem-vindo de volta</div>
        <div class="mayris-login__subtitle">Acesse sua conta para continuar.</div>
        <form method="post" class="mayris-login__form">
          {% csrf_token %}
          <label class="mayris-field">
            <span>Usuario</span>
            <input class="form-control" name="username" placeholder="Digite seu usuario" />
          </label>
          <label class="mayris-field">
            <span>Senha</span>
            <input class="form-control" type="password" name="password" placeholder="Digite sua senha" />
          </label>
          <button class="btn btn-primary mayris-btn-primary w-100" type="submit">Entrar</button>
          <a class="mayris-login__link" href="#">Esqueci minha senha</a>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
