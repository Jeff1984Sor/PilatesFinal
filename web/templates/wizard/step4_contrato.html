{% extends "base.html" %}
{% block content %}
<div class="card shadow-sm">
  <div class="card-body">
    <h3>Passo 4 - Contrato</h3>
    <form method="post">
      {% csrf_token %}
      <div class="row g-3">
        <div class="col-md-3">
          <input class="form-control" name="cdContrato" placeholder="Codigo" required />
        </div>
        <div class="col-md-3 js-valor-aula-group d-none">
          <input class="form-control js-valor-aula" name="valor_aula" placeholder="Valor por aula" type="number" step="0.01" />
        </div>
        <div class="col-md-3">
          <input class="form-control js-valor-parcela" name="valor_parcela" placeholder="Valor parcela" type="number" step="0.01" readonly />
        </div>
        <div class="col-md-3">
          <input class="form-control js-valor-total" name="valor_total" placeholder="Valor total" type="text" readonly />
        </div>
        <div class="col-md-3">
          <input class="form-control" name="dtInicioContrato" type="date" required />
        </div>
        <div class="col-md-3">
          <input class="form-control" name="dtFimContrato" type="date" required />
        </div>
        <div class="col-md-4">
          <select class="form-select" name="cdAluno" required>
            {% for a in alunos %}<option value="{{ a.id }}" {% if aluno_id == a.id %}selected{% endif %}>{{ a.dsNome }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <select class="form-select js-plano" name="cdPlano" required>
            {% for p in planos %}<option value="{{ p.id }}" data-recorrencia="{{ p.recorrencia }}" data-valor="{{ p.valor }}" data-duracao="{{ p.duracao_meses }}" data-aulas="{{ p.aulas_por_semana }}">{{ p.dsPlano }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <input class="form-control js-contrato-recorrencia" name="recorrencia" placeholder="Recorrencia" readonly />
        </div>
        <div class="col-md-4">
          <select class="form-select" name="cdUnidade" required>
            {% for u in unidades %}<option value="{{ u.id }}">{{ u.dsUnidade }}</option>{% endfor %}
          </select>
        </div>
        <div class="col-md-4">
          <select class="form-select" name="cdProfissional" required>
            {% for p in profissionais %}<option value="{{ p.id }}">{{ p.profissional }}</option>{% endfor %}
          </select>
        </div>
      </div>
      <button class="btn btn-primary mt-3" type="submit">Continuar</button>
    </form>
  </div>
</div>
{% endblock %}
