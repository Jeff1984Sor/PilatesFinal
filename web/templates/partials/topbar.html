<header class="mayris-topbar">
  <div class="mayris-topbar__search">
    <span class="mayris-topbar__label">Busca</span>
    <input class="form-control" placeholder="Aluno, CPF ou telefone" />
  </div>
  <div class="mayris-topbar__actions">
    <button class="btn mayris-icon-btn" type="button" aria-label="Notificacoes">!</button>
    <div class="mayris-user">
      <span class="mayris-user__name">{% firstof user.get_full_name user.username "Usuario" %}</span>
      <div class="mayris-avatar">{{ user.get_full_name|default:user.username|default:"U"|slice:":1"|upper }}</div>
    </div>
  </div>
</header>
