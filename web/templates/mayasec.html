{% extends "base.html" %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-2">
  <h3 class="mb-0">MayaSec</h3>
  <a class="btn btn-sm btn-outline-secondary" href="https://mayasec.mayacorp.com.br/" target="_blank" rel="noopener">Abrir em nova aba</a>
</div>
<div style="height: calc(100vh - 170px); min-height: 500px;">
  <iframe
    src="https://mayasec.mayacorp.com.br/"
    style="width:100%; height:100%; border:0; border-radius:8px;"
    title="MayaSec"
    allow="clipboard-read; clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>
</div>
<p class="text-muted small mt-2">
  Se a página não carregar aqui dentro, use o botão "Abrir em nova aba".
</p>
{% endblock %}
